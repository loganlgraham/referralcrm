name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      E2E_ADMIN_IDENTIFIER: ${{ secrets.E2E_ADMIN_IDENTIFIER }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_AHA_AGENT_IDENTIFIER: ${{ secrets.E2E_AHA_AGENT_IDENTIFIER }}
      E2E_AHA_AGENT_PASSWORD: ${{ secrets.E2E_AHA_AGENT_PASSWORD }}
      E2E_OOS_AGENT_IDENTIFIER: ${{ secrets.E2E_OOS_AGENT_IDENTIFIER }}
      E2E_OOS_AGENT_PASSWORD: ${{ secrets.E2E_OOS_AGENT_PASSWORD }}
      E2E_MC_IDENTIFIER: ${{ secrets.E2E_MC_IDENTIFIER }}
      E2E_MC_PASSWORD: ${{ secrets.E2E_MC_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - name: Decide whether e2e can run
      id: e2e
      run: |
        if [ -n "$PLAYWRIGHT_BASE_URL" ] && [ -n "$E2E_ADMIN_IDENTIFIER" ] && [ -n "$E2E_ADMIN_PASSWORD" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Skipping Playwright. Add PLAYWRIGHT_BASE_URL and E2E_* login secrets to enable CI e2e."
        fi
    - uses: actions/setup-node@v4
      if: steps.e2e.outputs.run == 'true'
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      if: steps.e2e.outputs.run == 'true'
      run: npm ci
    - name: Install Playwright Browsers
      if: steps.e2e.outputs.run == 'true'
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      if: steps.e2e.outputs.run == 'true'
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: steps.e2e.outputs.run == 'true' && !cancelled()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
